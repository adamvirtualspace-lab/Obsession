[package]
name = "obsession"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
obsession-core.workspace = true
iced = { workspace = true, features = ["wgpu", "thread-pool", "advanced", "canvas", "crisp", "web-colors", "image-without-codecs"] }
# Pictures in notes: only the common formats.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd.workspace = true
anyhow.workspace = true

# The vault watcher: our own on Windows (it sleeps until a change); notify
# elsewhere (inotify, FSEvents).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(not(windows))'.dependencies]
notify = { version = "8.2.2", default-features = false }
